name: Security maintenance 2026-09-20
on:
  push:
    branches: [security/hardening-2026-09-20]
permissions:
  contents: read
concurrency:
  group: security-maintenance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Resolve patched lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Commit only lockfile on this maintenance branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(security): synchronize patched dependency lock'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Install and audit
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm audit --omit=dev --json > security-dependency-audit.json || true
          node -e 'const a=require("./security-dependency-audit.json"); if(a.error) throw Error(JSON.stringify(a.error)); console.log(JSON.stringify(a.metadata)); if(a.metadata.vulnerabilities.high||a.metadata.vulnerabilities.critical) process.exit(1);'
      - name: Build without live credentials
        run: npm run build
      - name: Archive reviewed source
        if: always()
        run: git archive --format=tar.gz -o security-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-review-${{ github.run_id }}
          retention-days: 1
          path: |
            security-source.tar.gz
            security-dependency-audit.json
